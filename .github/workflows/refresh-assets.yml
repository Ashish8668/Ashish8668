name: Refresh profile assets

on:
  schedule:
    - cron: "0 3 * * *" # daily ~3:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Regenerate banner + activity graph
        run: python scripts/generate_assets.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.png activity-graph.png
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh profile graph dates and pulse values"
            git push
          fi
