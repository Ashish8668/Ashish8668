<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ashish Kamble  Full Stack &amp; AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- subtle grid -->
    <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
      <path d="M0 64h1200M0 128h1200M0 192h1200M0 256h1200"/>
      <path d="M160 0v320M320 0v320M480 0v320M640 0v320M800 0v320M960 0v320"/>
    </g>

    <!-- animated orbs -->
    <circle cx="980" cy="70" r="90" fill="url(#soft)">
      <animate attributeName="cx" values="980;1000;980" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;95;70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="230" r="110" fill="#34d399" opacity="0.08">
      <animate attributeName="r" values="100;120;100" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="250" r="70" fill="#38bdf8" opacity="0.08">
      <animate attributeName="cy" values="250;220;250" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- top accent line -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- left content -->
    <text x="64" y="88" fill="#67e8f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3">
      FULL STACK · AI / ML · BACKEND
    </text>

    <text x="64" y="150" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">
      Ashish Kamble
    </text>

    <text x="64" y="198" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">
      Building production-ready systems with clean architecture
    </text>

    <!-- typing cursor line -->
    <g font-family="Consolas, Monaco, monospace" font-size="18">
      <text x="64" y="250" fill="#94a3b8">&gt; </text>
      <text x="88" y="250" fill="#e2e8f0">
        <tspan>shipping agents, APIs &amp; scalable apps</tspan>
        <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.7;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
      <rect x="470" y="234" width="10" height="22" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- right decorative code card -->
    <g transform="translate(760,70)">
      <rect width="380" height="180" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>
      <circle cx="24" cy="24" r="6" fill="#f87171"/>
      <circle cx="44" cy="24" r="6" fill="#fbbf24"/>
      <circle cx="64" cy="24" r="6" fill="#34d399"/>
      <text x="24" y="64" fill="#64748b" font-family="Consolas, Monaco, monospace" font-size="14">const engineer = {</text>
      <text x="40" y="92" fill="#67e8f9" font-family="Consolas, Monaco, monospace" font-size="14">stack: ["MERN","AI","AWS"],</text>
      <text x="40" y="120" fill="#86efac" font-family="Consolas, Monaco, monospace" font-size="14">focus: "production systems",</text>
      <text x="40" y="148" fill="#fda4af" font-family="Consolas, Monaco, monospace" font-size="14">mode: "ship fast, stay solid"</text>
      <text x="24" y="176" fill="#64748b" font-family="Consolas, Monaco, monospace" font-size="14">}</text>
      <rect x="0" y="0" width="380" height="180" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.35" filter="url(#glow)"/>
    </g>
  </g>
</svg>
